  781717:  # Jul 19 2025 · Omaha @ Buffalo (Rich Hill)
    note: >
      Rich Hill, 45 years old, was called up to the majors mid-game for what turned
      out to be the final appearance of his career. He retired at the end of the season —
      one of the great journeyman stories in modern baseball.

