  # ── MLB ─────────────────────────────────────────────────────────────────────

  414357:  # May 27 2015 · TEX @ CLE
    note: ""

  490629:  # May 12 2017 · HOU @ NYY
    note: >
      An ALCS preview in May. These two teams would meet in the ALCS three times over
      the next six years (2017, 2019, 2022), with Houston winning each time. McCullers Jr.
      dominated for 6 innings, and McCann — a former Yankee — hit a 3-run homer off
      Montgomery to put it away.

  632965:  # Aug 11 2021 · TOR @ LAA
    note: ""

  663136:  # Apr 15 2022 · SFG @ CLE
    note: >
      The Guardians' home opener — the first game under the new name at Progressive Field,
      with Tom Hanks throwing out the first pitch. Carlos Rodón, who had no-hit this
      very franchise a year earlier as a White Sox, came back and beat them again.

  662325:  # Sep 11 2022 · STL @ PIT
    note: >
      Albert Pujols hit home run #697 to pass Alex Rodriguez for 4th all time in this
      game, part of his remarkable final-season chase to 700. Mitch Keller was dealing
      on the other side — 7 hitless innings, 0 ER — before the Pirates bullpen gave it
      all back in the 9th. STL won 4-3.

  718677:  # Apr 7 2023 · SEA @ CLE
    note: >
      Julio Rodríguez hit a tiebreaking 2-run homer in the 9th to send
      the Guardians crowd home unhappy. José Ramírez was his usual self.

  718625:  # Apr 11 2023 · BOS @ TBR
    note: >
      The Rays were 10-0 entering this game and won to go 11-0 — part of a 13-0 start
      that tied the modern MLB record. McClanahan struck out 9. Tampa outscored opponents
      101-30 during the streak and would finish the season with the best record in the AL.

  746125:  # Jul 21 2024 · BOS @ LAD
    note: >
      Ohtani's first season as a Dodger after the historic $700M deal — he was DH-only
      in 2024 while recovering from TJ surgery, but that didn't stop him: he hit a
      473-foot homer in this game to become the first NL player with 30 HRs on the season.
      Freeman also went deep. Kenley Jansen makes an appearance agains his former team.

