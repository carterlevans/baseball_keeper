  267232:  # May 7 2010 · Gwinnett @ Syracuse (Strasburg AAA debut)
    note: >
      Stephen Strasburg's AAA debut — the most hyped pitching prospect in years
      before he'd thrown a single MLB pitch. He went 6 innings, 0 ER, 6 Ks.
      He made his MLB debut three days later.

  326410:  # Apr 5 2012 · Rochester @ Syracuse (Harper AAA debut)
    note: >
      Bryce Harper's first game at the AAA level, just 19 years old.
      He was called up to the majors less than two weeks later.

