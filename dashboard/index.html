<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baseball Keeper — Player Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --green:   #1a3a1a;
    --grass:   #2d5a27;
    --chalk:   #f5f0e8;
    --dirt:    #c4922a;
    --red:     #c0392b;
    --gold:    #e8c84a;
    --teal:    #1a6b6b;
    --fade:    #8a8070;
    --ink:     #1c1c1c;
    --panel:   #f9f5ee;
    --border:  #d4cfc4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--chalk);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ───────────────────────────────────────── */
  header {
    background: var(--green);
    padding: 28px 32px 20px;
    border-bottom: 4px solid var(--dirt);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg, transparent, transparent 60px,
      rgba(255,255,255,.03) 60px, rgba(255,255,255,.03) 61px
    );
  }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    letter-spacing: .12em;
    color: var(--chalk);
    line-height: 1;
  }
  header .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .75rem;
    color: var(--dirt);
    margin-top: 6px;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    margin-top: 14px;
  }
  .legend-item {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .72rem;
    color: #aaa;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-item span { font-size: .95rem; }

  /* ── TAB NAV ──────────────────────────────────────── */
  nav {
    background: var(--green);
    display: flex;
    gap: 2px;
    padding: 0 32px;
    border-bottom: 3px solid var(--dirt);
    flex-wrap: wrap;
  }
  .tab-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: .1em;
    padding: 10px 28px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,.5);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -3px;
    transition: all .18s;
  }
  .tab-btn.active {
    color: var(--chalk);
    border-bottom-color: var(--dirt);
  }
  .tab-btn:hover:not(.active) { color: rgba(255,255,255,.8); }

  /* ── CONTROLS ─────────────────────────────────────── */
  .controls {
    padding: 14px 32px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 320px;
  }
  .search-wrap input {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .82rem;
    padding: 7px 12px 7px 32px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    background: white;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  .search-wrap input:focus { border-color: var(--grass); }
  .search-wrap::before {
    content: '⌕';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: .9rem;
    color: var(--fade);
  }

  .filter-btns { display: flex; gap: 6px; }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .72rem;
    padding: 5px 12px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    background: white;
    color: var(--fade);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .filter-btn.active {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .filter-btn:hover:not(.active) {
    border-color: var(--grass);
    color: var(--grass);
  }
  .count-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .72rem;
    color: var(--fade);
    margin-left: auto;
  }

  /* ── TABLE ────────────────────────────────────────── */
  .table-wrap {
    overflow-x: auto;
    padding: 0 0 40px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .8rem;
    min-width: 740px;
  }
  thead th {
    font-family: 'Bebas Neue', sans-serif;
    font-size: .85rem;
    letter-spacing: .08em;
    padding: 10px 10px 8px;
    text-align: right;
    border-bottom: 2px solid var(--border);
    background: var(--panel);
    color: var(--fade);
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    z-index: 10;
    white-space: nowrap;
    transition: color .15s;
  }
  thead th:first-child { text-align: right; padding-left: 6px; padding-right: 6px; min-width: 0; width: 32px; }
  thead th:nth-child(2) { text-align: left; padding-left: 16px; min-width: 200px; }
  thead th:hover { color: var(--ink); }
  thead th.sorted { color: var(--grass); }
  thead th .sort-arrow { font-size: .65rem; margin-left: 3px; }

  tbody tr {
    border-bottom: 1px solid #e8e4dc;
    transition: background .1s;
  }
  tbody tr:hover { background: rgba(45,90,39,.06); }
  tbody tr.flagged { background: rgba(232,200,74,.07); }
  tbody tr.flagged:hover { background: rgba(232,200,74,.14); }

  td {
    padding: 8px 10px;
    text-align: right;
    vertical-align: middle;
  }
  td:first-child { text-align: right; padding: 8px 6px; width: 32px; }
  td:nth-child(2) { text-align: left; padding-left: 16px; }

  .player-name {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: .83rem;
    color: var(--ink);
  }
  .player-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .68rem;
    color: var(--fade);
    margin-top: 1px;
  }
  .flag-badge {
    font-size: .78rem;
    cursor: help;
    position: relative;
  }
  .games-badge {
    display: inline-block;
    background: var(--green);
    color: white;
    font-size: .6rem;
    padding: 1px 5px;
    border-radius: 10px;
    margin-left: 4px;
    vertical-align: middle;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
  }
  .milb-chip {
    display: inline-block;
    background: var(--teal);
    color: white;
    font-size: .55rem;
    padding: 1px 4px;
    border-radius: 3px;
    margin-left: 4px;
    vertical-align: middle;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: .04em;
  }

  .stat-avg  { color: var(--dirt); font-weight: 600; }
  .stat-era  { color: var(--teal); font-weight: 600; }
  .stat-high { color: var(--red); }
  .stat-zero { color: #ccc; }
  .stat-war  { color: var(--grass); font-weight: 600; }

  .rank-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .72rem;
    color: var(--fade);
    text-align: right;
    cursor: help;
  }

  .no-results {
    text-align: center;
    padding: 48px 20px;
    color: var(--fade);
    font-family: 'IBM Plex Mono', monospace;
    font-size: .85rem;
  }

  /* ── TOOLTIP ──────────────────────────────────────── */
  .tooltip {
    display: none;
    position: fixed;
    background: var(--ink);
    color: var(--chalk);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: .78rem;
    padding: 8px 12px;
    border-radius: 4px;
    max-width: 300px;
    line-height: 1.4;
    z-index: 999;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  .tooltip::before {
    content: attr(data-badge);
    font-size: 1rem;
    margin-right: 6px;
  }

  /* ── GAME CARDS ───────────────────────────────────── */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 20px;
    padding: 28px 32px 48px;
  }
  .game-card {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    transition: box-shadow .15s;
  }
  .game-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .game-card-header {
    background: var(--green);
    padding: 10px 14px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .game-card-header:hover { background: var(--grass); }
  .game-card-header .matchup {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.05rem;
    letter-spacing: .08em;
    color: var(--chalk);
    flex: 1;
  }
  .game-card-header .game-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .65rem;
    color: var(--dirt);
    white-space: nowrap;
  }
  .expand-toggle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .9rem;
    color: rgba(255,255,255,.6);
    line-height: 1;
    margin-left: 6px;
    transition: color .15s;
    flex-shrink: 0;
  }
  .game-card-header:hover .expand-toggle { color: white; }
  .game-card-score {
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .score-box {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: .05em;
    line-height: 1;
    color: var(--ink);
  }
  .score-box .score-teams {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .65rem;
    color: var(--fade);
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .score-team-row { display: flex; justify-content: space-between; gap: 10px; }
  .score-team-row.winner { color: var(--ink); font-weight: 600; }
  .score-team-row .score-runs {
    font-family: 'Bebas Neue', sans-serif;
    font-size: .9rem;
    color: var(--ink);
  }
  .score-team-row.winner .score-runs { color: var(--grass); }
  .game-card-body { padding: 10px 14px 12px; }
  .game-card-row {
    display: flex;
    gap: 6px;
    align-items: baseline;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .72rem;
    color: var(--fade);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .game-card-row .label {
    font-size: .62rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    min-width: 28px;
    color: #bbb;
  }
  .game-card-row .val { color: var(--ink); }
  .game-card-row .val.win { color: var(--grass); }
  .game-card-row .val.loss { color: var(--red); }
  .game-card-note {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: .75rem;
    color: var(--fade);
    line-height: 1.5;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-style: italic;
  }
  .milb-tag {
    display: inline-block;
    background: var(--teal);
    color: white;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .55rem;
    padding: 1px 5px;
    border-radius: 3px;
    letter-spacing: .04em;
    margin-left: 6px;
    vertical-align: middle;
  }
  .games-filter-bar {
    padding: 14px 32px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* ── EXPANDED BOX SCORE ───────────────────────────── */
  .game-expand {
    border-top: 2px solid var(--border);
    background: #fafaf8;
    overflow-x: auto;
  }
  .expand-inner {
    padding: 14px;
    min-width: 0;
  }
  .box-linescore {
    width: 100%;
    border-collapse: collapse;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .7rem;
    margin-bottom: 14px;
    min-width: max-content;
  }
  .box-linescore thead th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .65rem;
    font-weight: 600;
    color: var(--fade);
    text-align: center;
    padding: 4px 6px;
    border-bottom: 1px solid var(--border);
    background: transparent;
    cursor: default;
    position: static;
    min-width: 0;
    width: auto;
    letter-spacing: 0;
  }
  .box-linescore thead th:first-child { text-align: left; width: 36px; }
  .box-linescore .rhe-sep { border-left: 2px solid var(--border); }
  .box-linescore tbody td {
    text-align: center;
    padding: 4px 6px;
    border-bottom: 1px solid #eee;
    font-size: .72rem;
  }
  .box-linescore tbody td:first-child {
    text-align: left;
    font-weight: 600;
    color: var(--ink);
    width: 36px;
    padding-left: 0;
  }
  .box-linescore .rhe-val {
    border-left: 2px solid var(--border);
    font-weight: 600;
    color: var(--ink);
  }
  .box-linescore .winning-score { color: var(--grass); }
  .box-section-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: .8rem;
    letter-spacing: .1em;
    color: var(--fade);
    margin: 10px 0 4px;
  }
  .box-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .68rem;
    margin-bottom: 10px;
    min-width: max-content;
  }
  .box-table thead th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .62rem;
    font-weight: 600;
    color: var(--fade);
    text-align: right;
    padding: 3px 5px;
    border-bottom: 1px solid var(--border);
    background: transparent;
    cursor: default;
    position: static;
    min-width: 0;
    width: auto;
    letter-spacing: 0;
  }
  .box-table thead th.box-name-h { text-align: left; min-width: 130px; }
  .box-table thead th.box-pos-h  { text-align: left; min-width: 30px; }
  .box-table tbody td {
    padding: 3px 5px;
    text-align: right;
    border-bottom: 1px solid #f0ede8;
    font-size: .68rem;
    color: var(--ink);
  }
  .box-table tbody tr:last-child td { border-bottom: none; }
  .box-table .box-name { text-align: left; color: var(--ink); }
  .box-table .box-pos  { text-align: left; color: var(--fade); }
  .box-decision {
    font-size: .62rem;
    color: var(--dirt);
    font-style: italic;
  }
  .box-sub-row td { color: var(--fade); font-size: .65rem; }
  .box-sub-row .box-name { padding-left: 10px; color: var(--fade); }

  /* ── MLB COVERAGE WALL ────────────────────────────── */
  .coverage-league { margin-bottom: 28px; }
  .coverage-league-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: .12em;
    color: var(--fade);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .coverage-divisions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .coverage-division { }
  .coverage-division-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .62rem;
    letter-spacing: .1em;
    color: #bbb;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .coverage-teams { display: flex; flex-direction: column; gap: 5px; }
  .coverage-team {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 4px;
    border: 1.5px solid transparent;
  }
  .coverage-team {
    background: white;
    border-color: var(--border);
  }
  .coverage-team.unseen {
    background: rgba(0,0,0,.02);
    border-color: #e8e4dc;
  }
  .coverage-team-abbr {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--green);
    width: 34px;
    flex-shrink: 0;
  }
  .coverage-team.unseen .coverage-team-abbr { color: #c0bbb0; }
  .coverage-team-info { flex: 1; min-width: 0; }
  .coverage-team-name {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: .72rem;
    font-weight: 600;
    color: var(--ink);
  }
  .coverage-team.unseen .coverage-team-name { color: var(--fade); }
  /* Stadium chip — filled if visited, outline if not */
  .stadium-chip {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .57rem;
    padding: 2px 6px;
    border-radius: 3px;
    margin-top: 3px;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: .02em;
  }
  .stadium-chip.visited {
    background: var(--green);
    color: var(--chalk);
    border: 1.5px solid var(--green);
  }
  .stadium-chip.not-visited {
    background: transparent;
    color: #bbb;
    border: 1.5px solid #d8d4cc;
  }
  .coverage-team-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .6rem;
    color: var(--dirt);
    flex-shrink: 0;
  }
  @media (max-width: 860px) {
    .coverage-divisions { grid-template-columns: 1fr; }
  }

  /* ── HOME TAB ─────────────────────────────────────── */
  .home-wrap { padding: 28px 32px 48px; }
  .home-stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
  }
  .home-stat-card {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    text-align: center;
  }
  .home-stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    color: var(--green);
    line-height: 1;
  }
  .home-stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .65rem;
    color: var(--fade);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-top: 4px;
  }
  .home-stat-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .6rem;
    color: var(--border);
    margin-top: 2px;
  }
  .home-section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: .1em;
    color: var(--green);
    border-bottom: 2px solid var(--border);
    padding-bottom: 6px;
    margin-bottom: 14px;
  }
  .home-cols {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
    margin-bottom: 32px;
  }
  .home-top-list {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .home-top-list-title {
    background: var(--green);
    font-family: 'Bebas Neue', sans-serif;
    font-size: .9rem;
    letter-spacing: .1em;
    color: var(--chalk);
    padding: 7px 12px;
  }
  .home-top-row {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    border-bottom: 1px solid #eee;
    gap: 8px;
  }
  .home-top-row:last-child { border-bottom: none; }
  .home-top-rank {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .65rem;
    color: var(--fade);
    width: 16px;
    text-align: right;
    flex-shrink: 0;
  }
  .home-top-name {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: .78rem;
    font-weight: 600;
    color: var(--ink);
    flex: 1;
  }
  .home-top-stat {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .65rem;
    color: var(--fade);
    text-align: right;
  }
  .home-recent-section { margin-top: 8px; }
  .home-recent-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  /* ── SUPERLATIVES CAROUSEL ───────────────────────── */
  .carousel-section { margin-bottom: 32px; }
  .carousel-outer {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .carousel-btn {
    background: var(--green);
    border: none;
    color: var(--chalk);
    font-size: 1.5rem;
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .75;
    transition: opacity .15s;
    line-height: 1;
    padding-bottom: 2px;
  }
  .carousel-btn:hover { opacity: 1; }
  .carousel-btn:disabled { opacity: .2; cursor: default; }
  .carousel-track {
    display: flex;
    overflow-x: auto;

<script>
// ── State ──────────────────────────────────────────────────────
let allPlayers  = [];
let allGames    = [];
let statcastData = null;
let gamesFilter = 'all';
let batSort = { col: '_rank', dir: 1 };
let staSort = { col: '_rank', dir: 1 };
let relSort = { col: '_rank', dir: 1 };
let batFilter = 'all';
let staFilter = 'all';
let relFilter = 'all';

// ── Data access ────────────────────────────────────────────────
const getBatters  = () => allPlayers.filter(p => p.roles.includes('batter') && (!p.pitcher_role || p.AB >= 10));
const getStarters  = () => allPlayers.filter(p => p.pitcher_role === 'starter');
const getRelievers = () => allPlayers.filter(p => p.pitcher_role === 'reliever');

// ── Assign permanent rank to each player on load ───────────────
function assignRanks(players) {
  const rank = (arr, scoreKey) => {
    [...arr].sort((a, b) => b[scoreKey] - a[scoreKey])
            .forEach((p, i) => p._rank = i + 1);
  };
  rank(players.filter(p => p.roles.includes('batter') && (!p.pitcher_role || p.AB >= 10)), 'ranking_score');
  rank(players.filter(p => p.pitcher_role === 'starter'),  'pitcher_ranking_score');
  rank(players.filter(p => p.pitcher_role === 'reliever'), 'pitcher_ranking_score');
}

// ── Helpers ────────────────────────────────────────────────────
function ipToFloat(ip) {
  const [w, f = '0'] = String(ip).split('.');
  return parseInt(w) + parseInt(f) / 3;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Sort ───────────────────────────────────────────────────────
function getValue(p, col) {
  if (col === 'name')    return p.full_name.toLowerCase();
  if (col === 'AVG')     return parseFloat(p.AVG) || 0;
  if (col === 'ERA')     return p.ERA === '—' ? 999 : (parseFloat(p.ERA) || 0);
  if (col === 'IP')      return ipToFloat(p.IP);
  if (col === '_rank')   return p._rank ?? 999;
  if (col === 'pitcher_ranking_score') return p.pitcher_ranking_score ?? 0;
  return p[col] ?? 0;
}

function sortData(arr, state) {
  return [...arr].sort((a, b) => {
    const av = getValue(a, state.col), bv = getValue(b, state.col);
    return av < bv ? -state.dir : av > bv ? state.dir : 0;
  });
}

function sortBat(col) {
  batSort.dir = (batSort.col === col) ? batSort.dir * -1 : (col === 'name' ? 1 : -1);
  batSort.col = col;
  renderBat();
}
function sortSta(col) {
  staSort.dir = (staSort.col === col) ? staSort.dir * -1 : (col === 'name' ? 1 : -1);
  staSort.col = col;
  renderSta();
}
function sortRel(col) {
  relSort.dir = (relSort.col === col) ? relSort.dir * -1 : (col === 'name' ? 1 : -1);
  relSort.col = col;
  renderRel();
}

// ── Filter ─────────────────────────────────────────────────────
function setBatFilter(el, f) {
  batFilter = f;
  document.querySelectorAll('#tab-batters .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderBat();
}
function setStaFilter(el, f) {
  staFilter = f;
  document.querySelectorAll('#tab-starters .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderSta();
}
function setRelFilter(el, f) {
  relFilter = f;
  document.querySelectorAll('#tab-relievers .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderRel();
}
function applyFilter(arr, filter) {
  if (filter === 'flagged') return arr.filter(p => p.badge);
  if (filter === 'multi')   return arr.filter(p => p.games_seen > 1);
  return arr;
}

// ── Stat coloring ──────────────────────────────────────────────
function avgClass(avg) {
  const v = parseFloat(avg);
  if (v >= 0.400) return 'stat-high';
  if (v === 0)    return 'stat-zero';
  return 'stat-avg';
}
function eraClass(era) {
  if (era === '—')       return 'stat-zero';
  const v = parseFloat(era);
  if (v === 0)           return 'stat-avg';
  if (v >= 9.00)         return 'stat-high';
  return 'stat-era';
}
function soHighClass(so, ip) {
  if (ip && ipToFloat(ip) > 0 && so / ipToFloat(ip) > 10) return 'stat-high';
  return '';
}
function warDisplay(war) {
  if (war <= 0) return `<span class="stat-zero">${war.toFixed(1)}</span>`;
  return `<span class="stat-war">${war.toFixed(1)}</span>`;
}

// ── Player name cell ───────────────────────────────────────────
function nameCell(p) {
  const badge = p.badge
    ? `<span class="flag-badge" data-badge="${escHtml(p.badge)}" data-note="${escHtml(p.note)}" onmouseenter="showTip(event,this)" onmouseleave="hideTip()">${p.badge}</span>`
    : '';
  const gBadge = p.games_seen > 1
    ? `<span class="games-badge">${p.games_seen}G</span>`
    : '';
  const milb = p.seen_in_milb
    ? `<span class="milb-chip">MiLB</span>`
    : '';
  return `<div class="player-name">${escHtml(p.full_name)} ${badge}${gBadge}${milb}</div>`;
}

// ── Sort arrows ────────────────────────────────────────────────
function updateSortArrows(tableId, state) {
  document.querySelectorAll(`#${tableId} thead th`).forEach(th => {
    const col = th.dataset.col;
    th.classList.toggle('sorted', col === state.col);
    const arr = th.querySelector('.sort-arrow');
    if (arr) arr.textContent = col === state.col ? (state.dir === -1 ? '▾' : '▴') : '';
  });
}

// ── Tooltip ────────────────────────────────────────────────────
function showTip(e, el) {
  const tip = document.getElementById('tooltip');
  tip.setAttribute('data-badge', el.dataset.badge);
  tip.textContent = el.dataset.note;
  tip.style.display = 'block';
  moveTip(e);
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}
document.addEventListener('mousemove', e => {
  if (document.getElementById('tooltip').style.display === 'block') moveTip(e);
});
function moveTip(e) {
  const tip = document.getElementById('tooltip');
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 320) + 'px';
  tip.style.top  = Math.max(e.clientY - 10, 4) + 'px';
}

function setGamesFilter(el, f) {

function fmtDate(iso) {
  const [y, m, d] = iso.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)-1]} ${parseInt(d)}, ${y}`;
}

// ── Expandable box score ────────────────────────────────────────
function toggleExpand(headerEl) {
  const card   = headerEl.closest('.game-card');
  const expand = card.querySelector('.game-expand');
  const btn    = headerEl.querySelector('.expand-toggle');
  if (!expand) return;
  const isOpen = expand.style.display !== 'none';
  expand.style.display = isOpen ? 'none' : 'block';
  btn.textContent      = isOpen ? '＋' : '－';
}

function buildExpandSection(g) {
  if (!g.innings || !g.innings.length) return '';

  const awayWon = g.away_score > g.home_score;

  // Linescore
  const innHeaders = g.innings.map(i => `<th>${i.num}</th>`).join('');
  const awayRuns   = g.innings.map(i => {
    const v = i.away_r === '' ? 'x' : i.away_r;
    return `<td>${v}</td>`;
  }).join('');
  const homeRuns = g.innings.map(i => {
    const v = i.home_r === '' ? 'x' : i.home_r;
    return `<td>${v}</td>`;
  }).join('');

  const linescore = `
    <table class="box-linescore">
      <thead><tr>
        <th></th>${innHeaders}
        <th class="rhe-sep">R</th><th>H</th><th>E</th>
      </tr></thead>
      <tbody>
        <tr>
          <td>${escHtml(g.away_abbr)}</td>${awayRuns}
          <td class="rhe-val ${awayWon ? 'winning-score' : ''}">${g.away_totals.r}</td>
          <td class="rhe-val">${g.away_totals.h}</td>
          <td class="rhe-val">${g.away_totals.e}</td>
        </tr>
        <tr>
          <td>${escHtml(g.home_abbr)}</td>${homeRuns}
          <td class="rhe-val ${!awayWon ? 'winning-score' : ''}">${g.home_totals.r}</td>
          <td class="rhe-val">${g.home_totals.h}</td>
          <td class="rhe-val">${g.home_totals.e}</td>
        </tr>
      </tbody>
    </table>`;

  function batTable(players, abbr) {
    if (!players || !players.length) return '';
    const rows = players.map(p => {
      const isSub = p.batting_order && p.batting_order % 100 !== 0;
      const nameCell = isSub
        ? `<td class="box-name" style="padding-left:14px;color:var(--fade)">↳ ${escHtml(p.name)}</td>`
        : `<td class="box-name">${escHtml(p.name)}</td>`;
      return `
      <tr class="${isSub ? 'box-sub-row' : ''}">
        ${nameCell}
        <td class="box-pos">${escHtml(p.pos)}</td>
        <td>${p.ab}</td><td>${p.r}</td><td>${p.h}</td>
        <td>${p.rbi}</td><td>${p.hr}</td><td>${p.bb}</td><td>${p.so}</td>
      </tr>`;
    }).join('');
    return `
      <div class="box-section-label">${escHtml(abbr)} Batting</div>
      <div style="overflow-x:auto">
      <table class="box-table">
        <thead><tr>
          <th class="box-name-h">Player</th><th class="box-pos-h">Pos</th>
          <th>AB</th><th>R</th><th>H</th><th>RBI</th><th>HR</th><th>BB</th><th>SO</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>`;
  }

  function pitTable(players, abbr) {
    if (!players || !players.length) return '';
    const rows = players.map(p => `
      <tr>
        <td class="box-name">${escHtml(p.name)} <span class="box-decision">${escHtml(p.note)}</span></td>
        <td>${p.ip}</td><td>${p.h}</td><td>${p.er}</td><td>${p.bb}</td><td>${p.so}</td>
      </tr>`).join('');
    return `
      <div class="box-section-label">${escHtml(abbr)} Pitching</div>
      <div style="overflow-x:auto">
      <table class="box-table">
        <thead><tr>
          <th class="box-name-h">Pitcher</th>
          <th>IP</th><th>H</th><th>ER</th><th>BB</th><th>SO</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>`;
  }

  return `
    <div class="game-expand" id="expand-${g.pk}" style="display:none">
      <div class="expand-inner">
        <div style="overflow-x:auto">${linescore}</div>
        ${batTable(g.away_batters, g.away_abbr)}
        ${pitTable(g.away_pitchers, g.away_abbr)}
        ${batTable(g.home_batters, g.home_abbr)}
        ${pitTable(g.home_pitchers, g.home_abbr)}
      </div>
    </div>`;
}

    const wpRow = g.winning_pitcher
      ? `<div class="game-card-row"><span class="label">WP</span><span class="val win">${escHtml(g.winning_pitcher)}</span></div>` : '';
    const lpRow = g.losing_pitcher
      ? `<div class="game-card-row"><span class="label">LP</span><span class="val loss">${escHtml(g.losing_pitcher)}</span></div>` : '';
    const svRow = g.save_pitcher
      ? `<div class="game-card-row"><span class="label">SV</span><span class="val">${escHtml(g.save_pitcher)}</span></div>` : '';
    const starRow = g.top_hitter
      ? `<div class="game-card-row"><span class="label">⭐</span><span class="val">${escHtml(g.top_hitter)} — ${escHtml(g.top_hitter_line)}</span></div>` : '';

    return `

  }).join('');

// ── Superlatives computation ──────────────────────────────────
function computeSuperlatives() {
  const mlb = allGames.filter(g => g.level === 'MLB');
  const cards = [];

  // 1. Most visited ballpark
  const venueCounts = {};
  allGames.forEach(g => { if (g.venue) venueCounts[g.venue] = (venueCounts[g.venue]||0)+1; });
  const venues = Object.entries(venueCounts).sort((a,b) => b[1]-a[1]);
  if (venues.length) cards.push({
    emoji: '🏟️', label: 'Most visited ballpark',
    headline: venues[0][0],
    detail: `${venues[0][1]} game${venues[0][1]>1?'s':''} attended`
  });

  // 2. Busiest month
  const mCounts = {};
  const mNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  allGames.forEach(g => { const m = new Date(g.date+'T12:00:00').getMonth(); mCounts[m]=(mCounts[m]||0)+1; });
  const months = Object.entries(mCounts).sort((a,b) => b[1]-a[1]);
  if (months.length) cards.push({
    emoji: '📅', label: 'Busiest month',
    headline: mNames[+months[0][0]],
    detail: `${months[0][1]} games attended`
  });

  // 3. Total innings witnessed
  const totalInn = allGames.reduce((s,g) => s+(g.innings?g.innings.length:9), 0);
  cards.push({
    emoji: '⚾', label: 'Total baseball witnessed',
    headline: `${totalInn} Innings`,
    detail: `across all ${allGames.length} games`
  });

  // 4. Highest scoring game (MLB)
  const hiScore = [...mlb].sort((a,b) => (b.away_score+b.home_score)-(a.away_score+a.home_score))[0];
  if (hiScore) cards.push({
    emoji: '🔥', label: 'Highest scoring game',
    headline: `${hiScore.away_score+hiScore.home_score} Runs`,
    detail: `${hiScore.away_abbr} ${hiScore.away_score}–${hiScore.home_score} ${hiScore.home_abbr} · ${fmtDate(hiScore.date)}`
  });

  // 5. Biggest blowout (MLB)
  const blowout = [...mlb].sort((a,b) => Math.abs(b.away_score-b.home_score)-Math.abs(a.away_score-a.home_score))[0];
  if (blowout) {
    const diff = Math.abs(blowout.away_score-blowout.home_score);
    const winner = blowout.away_score>blowout.home_score ? blowout.away_abbr : blowout.home_abbr;
    cards.push({
      emoji: '💀', label: 'Biggest blowout',
      headline: `${winner} by ${diff}`,
      detail: `${blowout.away_abbr} ${blowout.away_score}–${blowout.home_score} ${blowout.home_abbr} · ${fmtDate(blowout.date)}`
    });
  }

  // 6. Best pitcher's duel (lowest combined, MLB)
  const duel = [...mlb].sort((a,b) => (a.away_score+a.home_score)-(b.away_score+b.home_score))[0];
  if (duel) {
    const tot = duel.away_score+duel.home_score;
    cards.push({
      emoji: '🤫', label: "Best pitcher's duel",
      headline: `${tot} Total Run${tot===1?'':'s'}`,
      detail: `${duel.away_abbr} ${duel.away_score}–${duel.home_score} ${duel.home_abbr} · ${fmtDate(duel.date)}`
    });
  }

  // 7. Most HRs in a single game
  let maxHRG = null, maxHRs = 0;
  allGames.forEach(g => {
    const hrs = [...(g.away_batters||[]),...(g.home_batters||[])].reduce((s,b)=>s+(b.hr||0),0);
    if (hrs > maxHRs) { maxHRs=hrs; maxHRG=g; }
  });
  if (maxHRG && maxHRs>0) cards.push({
    emoji: '💥', label: 'Most HRs in one game',
    headline: `${maxHRs} Home Run${maxHRs===1?'':'s'}`,
    detail: `${maxHRG.away_abbr} @ ${maxHRG.home_abbr} · ${fmtDate(maxHRG.date)}`
  });

  // 8. Most Ks by a single pitcher in one outing
  let maxKP='', maxKG=null, maxKs=0;
  allGames.forEach(g => {
    [...(g.away_pitchers||[]),...(g.home_pitchers||[])].forEach(p => {
      if ((p.so||0)>maxKs) { maxKs=p.so; maxKP=p.name; maxKG=g; }
    });
  });
  if (maxKG) cards.push({
    emoji: '🎯', label: 'Best pitching outing',
    headline: `${maxKs} Strikeouts`,
    detail: `${maxKP} · ${maxKG.away_abbr} @ ${maxKG.home_abbr}`
  });

  // 9. Most-watched franchise (home+away, MLB)
  const fCounts = {};
  mlb.forEach(g => {
    fCounts[g.away_abbr]=(fCounts[g.away_abbr]||0)+1;
    fCounts[g.home_abbr]=(fCounts[g.home_abbr]||0)+1;
  });
  const topF = Object.entries(fCounts).sort((a,b)=>b[1]-a[1])[0];
  if (topF) cards.push({
    emoji: '🏆', label: 'Most-watched franchise',
    headline: topF[0],
    detail: `${topF[1]} game${topF[1]>1?'s':''} — most of any team`
  });

  // 10 & 11. Lucky / Jinx team (min 2 games, MLB)
  const rec = {};
  mlb.forEach(g => {
    if (!rec[g.away_abbr]) rec[g.away_abbr]={w:0,l:0};
    if (!rec[g.home_abbr]) rec[g.home_abbr]={w:0,l:0};
    if (g.away_score!==g.home_score) {
      const homeWin = g.home_score>g.away_score;
      rec[g.away_abbr][homeWin?'l':'w']++;
      rec[g.home_abbr][homeWin?'w':'l']++;
    }
  });
  const eligible = Object.entries(rec).filter(([,r])=>r.w+r.l>=2);
  const pct = r => r.w/(r.w+r.l||1);
  if (eligible.length>=1) {
    const [lt,lr] = [...eligible].sort((a,b)=>pct(b[1])-pct(a[1]))[0];
    cards.push({ emoji:'🍀', label:'Your lucky team', headline:lt, detail:`${lr.w}–${lr.l} when you show up` });
  }
  if (eligible.length>=2) {
    const [jt,jr] = [...eligible].sort((a,b)=>pct(a[1])-pct(b[1]))[0];
    cards.push({ emoji:'🫠', label:'Your jinx team', headline:jt, detail:`${jr.w}–${jr.l} when you show up` });
  }

  // 12 & 13. Player appearance tracking (box score lines)
  const pDates = {}; // name -> [Date, ...]
  allGames.forEach(g => {
    const d = new Date(g.date+'T12:00:00');
    const seen = new Set();
    [...(g.away_batters||[]),...(g.home_batters||[]),...(g.away_pitchers||[]),...(g.home_pitchers||[])].forEach(p => {
      if (p.name && !seen.has(p.name)) { seen.add(p.name); (pDates[p.name]=pDates[p.name]||[]).push(d); }
    });
  });

  // Longest gap between any two appearances
  let gapDays=0, gapName='', gapFrom=null, gapTo=null;
  Object.entries(pDates).forEach(([name,dates]) => {
    if (dates.length<2) return;
    dates.sort((a,b)=>a-b);
    for (let i=1;i<dates.length;i++) {
      const days=Math.round((dates[i]-dates[i-1])/86400000);
      if (days>gapDays) { gapDays=days; gapName=name; gapFrom=dates[i-1]; gapTo=dates[i]; }
    }
  });
  if (gapName) {
    const fmt = d => d.toLocaleDateString('en-US',{month:'short',year:'numeric'});
    cards.push({
      emoji:'⏱️', label:'Longest gap between appearances',
      headline:`${gapDays} Days`,
      detail:`${gapName} · ${fmt(gapFrom)} → ${fmt(gapTo)}`
    });
  }

  // Most-seen player (most distinct games in box scores)
  const topP = Object.entries(pDates).sort((a,b)=>b[1].length-a[1].length)[0];
  if (topP) cards.push({
    emoji:'👁️', label:'Most-seen player',
    headline: topP[0].split(' ').slice(-1)[0],
    detail:`${topP[0]} · ${topP[1].length} box scores`
  });

  // 14. Hall of Famers seen (🏛️ badge)
  const hofers = allPlayers.filter(p => p.badge && p.badge.includes('🏛️'));
  if (hofers.length) cards.push({
    emoji:'🎖️', label:'Hall of Famers seen',
    headline:`${hofers.length} HOFers`,
    detail: hofers.map(p => p.full_name.split(' ').slice(-1)[0]).join(', ')
  });

  // 15. Highest peak WAR player seen
  const topWAR = [...allPlayers].sort((a,b) => parseFloat(b.peak_war||0) - parseFloat(a.peak_war||0))[0];
  if (topWAR && topWAR.peak_war) cards.push({
    emoji:'📊', label:'Highest peak WAR seen',
    headline:`${topWAR.peak_war} WAR`,
    detail:`${topWAR.full_name} — best season peak`
  });

  // 16. Most cumulative HRs by one batter across all games
  const hrTotals = {};
  allGames.forEach(g => {
    [...(g.away_batters||[]),...(g.home_batters||[])].forEach(b => {
      if (b.name && b.hr) hrTotals[b.name] = (hrTotals[b.name]||0) + b.hr;
    });
  });
  const topHRB = Object.entries(hrTotals).sort((a,b)=>b[1]-a[1])[0];
  if (topHRB && topHRB[1] > 1) cards.push({
    emoji:'🚀', label:'Most HRs across your games',
    headline:`${topHRB[1]} Career HRs`,
    detail:`${topHRB[0]} — hit in multiple games`
  });

  // 17. Biggest single inning (most runs by one team in one half-inning)
  let bigInn = null, bigRuns = 0;
  allGames.forEach(g => {
    (g.innings||[]).forEach(inn => {
      [['away_r', g.away_abbr], ['home_r', g.home_abbr]].forEach(([key, abbr]) => {
        const r = inn[key] || 0;
        if (r > bigRuns) { bigRuns = r; bigInn = { r, abbr, num: inn.num, g }; }
      });
    });
  });
  if (bigInn) cards.push({
    emoji:'🌋', label:'Biggest single inning',
    headline:`${bigInn.r}-Run ${ordinal(bigInn.num)}`,
    detail:`${bigInn.abbr} · ${bigInn.g.away_abbr} @ ${bigInn.g.home_abbr}${bigInn.g.level==='MiLB'?' (MiLB)':''}`
  });

  // 18. Worst start witnessed (most ER in one outing)
  let worstStart = null, worstER = 0;
  allGames.forEach(g => {
    [...(g.away_pitchers||[]),...(g.home_pitchers||[])].forEach(p => {
      const er = parseInt(p.er) || 0;
      if (er > worstER) { worstER = er; worstStart = { er, name: p.name, g }; }
    });
  });
  if (worstStart) cards.push({
    emoji:'😤', label:'Worst outing you witnessed',
    headline:`${worstStart.er} Earned Runs`,
    detail:`${worstStart.name} · ${worstStart.g.away_abbr} @ ${worstStart.g.home_abbr}`
  });

  // ── Statcast superlatives (loaded from statcast_superlatives.json) ───────
  if (statcastData && statcastData.overall) {
    const sc = statcastData.overall;

    // Helper: "Last, First" → "First Last"
    const flipName = s => {
      if (!s) return '';
      const parts = s.split(',');
      return parts.length === 2 ? `${parts[1].trim()} ${parts[0].trim()}` : s;
    };

    if (sc.farthest_hr) {
      const h = sc.farthest_hr;
      cards.push({
        emoji: '🚀', label: 'Farthest home run witnessed',
        headline: `${h.distance_ft} ft`,
        detail: `${flipName(h.batter)} · ${h.game} · ${fmtDate(h.date)}`
      });
    }

    if (sc.hardest_hit) {
      const h = sc.hardest_hit;
      cards.push({
        emoji: '💨', label: 'Hardest exit velocity',
        headline: `${h.exit_velo_mph} mph`,
        detail: `${flipName(h.batter)} (${h.events || 'batted ball'}) · ${h.game}`
      });
    }

    if (sc.fastest_pitch) {
      const h = sc.fastest_pitch;
      cards.push({
        emoji: '⚡', label: 'Fastest pitch',
        headline: `${h.speed_mph} mph`,
        detail: `${h.pitcher}${h.pitch_name ? ' · ' + h.pitch_name : ''} · ${h.game}`
      });
    }

    if (sc.most_spin) {
      const h = sc.most_spin;
      cards.push({
        emoji: '🌀', label: 'Highest spin rate',
        headline: `${h.spin_rpm.toLocaleString()} RPM`,
        detail: `${h.pitcher}${h.pitch_name ? ' · ' + h.pitch_name : ''} · ${h.game}`
      });
    }

    if (sc.most_break) {
      const h = sc.most_break;
      cards.push({
        emoji: '🏹', label: 'Most pitch movement',
        headline: `${h.break_in}"`,
        detail: `${h.pitcher}${h.pitch_name ? ' · ' + h.pitch_name : ''} · ${h.game}`
      });
    }
  }

  return cards;
}

function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]) + ' inning';
}

function pitchZoneSvg(ctx) {
  const W = 150, H = 185;
  const X_LO = -1.5, X_HI = 1.5;   // feet
  const Z_LO = 0.5,  Z_HI = 5.0;
  const px = x => ((x - X_LO) / (X_HI - X_LO)) * W;
  const pz = z => ((Z_HI - z) / (Z_HI - Z_LO)) * H;

  const HALF_PLATE = 0.7083;
  const szT = ctx.sz_top || 3.4;
  const szB = ctx.sz_bot || 1.6;

  // Strike zone rect
  const zx = px(-HALF_PLATE), zw = px(HALF_PLATE) - px(-HALF_PLATE);
  const zy = pz(szT),         zh = pz(szB) - pz(szT);

  let dot = '';
  if (ctx.plate_x !== null && ctx.plate_x !== undefined &&
      ctx.plate_z !== null && ctx.plate_z !== undefined) {
    const dx = px(ctx.plate_x), dz = pz(ctx.plate_z);
    const inZone = Math.abs(ctx.plate_x) <= HALF_PLATE &&
                   ctx.plate_z >= szB && ctx.plate_z <= szT;
    const col = inZone ? '#c0392b' : '#1a3a1a';
    dot = `<circle cx="${dx.toFixed(1)}" cy="${dz.toFixed(1)}" r="7"
             fill="${col}" opacity=".82" stroke="white" stroke-width="1.5"/>`;
  }

  // Home plate (simple trapezoid at bottom)
  const plateL = px(-HALF_PLATE), plateR = px(HALF_PLATE);
  const plateY = H - 10;

  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
    style="border:1px solid var(--border);border-radius:5px;background:#f9f5ee;display:block">
    <rect x="${zx.toFixed(1)}" y="${zy.toFixed(1)}"
          width="${zw.toFixed(1)}" height="${zh.toFixed(1)}"
          fill="none" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="5,3" rx="1"/>
    <polygon points="${plateL},${plateY} ${plateR},${plateY} ${((plateL+plateR)/2+8).toFixed(0)},${H-2} ${((plateL+plateR)/2).toFixed(0)},${H} ${((plateL+plateR)/2-8).toFixed(0)},${H-2}"
             fill="#d4cfc4" stroke="#aaa" stroke-width="1"/>
    ${dot}
  </svg>`;
}

     : d.category === 'most_spin'     ? `${ev.spin_rpm.toLocaleString()} RPM`
     :                                  `${ev.break_in}" break`);

      <span class="sc-base first ${runners.includes('1st')?'on':''}"></span>

  const runnersText = runners.length ? runners.join(', ') : 'Bases empty';

  const scoreText = `${ctx.away_abbr} ${ctx.away_score}–${ctx.home_score} ${ctx.home_abbr}`;

  // ── Opposing player ──────────────────────────────────────────────────────
  const opposing    = isBatted ? ctx.pitcher : ctx.batter;

  const hand        = isBatted

  const descKey  = (ctx.description || '').toLowerCase();

  const desText  = ctx.des && ctx.des !== ctx.description ? ctx.des : '';

  // ── Pitch location ───────────────────────────────────────────────────────
  const zoneSvg    = pitchZoneSvg(ctx);
  const hasLocation = ctx.plate_x !== null && ctx.plate_x !== undefined;
  const locText    = hasLocation
    ? `${Math.abs(ctx.plate_x).toFixed(2)}ft ${ctx.plate_x >= 0 ? 'arm-side' : 'glove-side'}
       · ${ctx.plate_z ? ctx.plate_z.toFixed(2)+'ft high' : ''}`
    : '';

  document.getElementById('scModalBody').innerHTML = `
    <div class="sc-modal-info">
      <div class="sc-info-section">
        <div class="sc-info-label">Situation</div>
        <div class="sc-info-value">${ctx.half} ${ctx.inning}  ·  ${ctx.outs} out${ctx.outs==='1'?'':'s'}  ·  Count ${ctx.count}</div>

        <div class="sc-info-sub" style="margin-top:3px">Score: ${scoreText}</div>
      </div>
      <div class="sc-info-section">
        <div class="sc-info-label">${opposingLbl}</div>

      </div>

        <div class="sc-info-label">Result</div>
        <div class="sc-info-value">${escHtml(descDisp)}</div>
        ${desText ? `<div class="sc-desc-box">${escHtml(desText)}</div>` : ''}
      </div>
    </div>
    <div class="sc-zone-wrap">
      <div class="sc-zone-label">Pitch location</div>
      ${hasLocation ? zoneSvg : '<div class="sc-info-value muted" style="font-size:.72rem">No location data</div>'}
      ${hasLocation ? `<div class="sc-info-sub" style="text-align:center">${locText}</div>` : ''}
    </div>`;

  document.getElementById('scModal').classList.add('open');
}

// ── Statcast tab ───────────────────────────────────────────────
function toggleScSection(el) {
  el.closest('.sc-section').classList.toggle('open');
}

function renderStatcast() {
  if (!statcastData || !statcastData.top10) {
    document.getElementById('statcast-content').innerHTML =
      '<p style="padding:32px;color:var(--fade);font-family:\'IBM Plex Mono\',monospace;font-size:.8rem;">No Statcast data loaded.</p>';
    return;
  }

  scDetailData = [];
  const t = statcastData.top10;

  const rankCls = i => i === 0 ? 'sc-rank sc-rank-gold'
                     : i === 1 ? 'sc-rank sc-rank-silver'
                     : i === 2 ? 'sc-rank sc-rank-bronze'
                     : 'sc-rank';

  function regRow(cells, ev, category) {
    const idx = scDetailData.length;
    scDetailData.push({ ev, ctx: ev.ctx || {}, category });
    return `<tr onclick="showScDetail(${idx})" style="cursor:pointer">${cells}</tr>`;
  }

  // ── Table builders ───────────────────────────────────────────────────────
  function hrTable(rows, cat) {
    const head = `<tr><th></th><th>Batter</th><th class="num">Distance</th><th class="num">Exit Velo</th><th class="num">Angle</th><th>Game</th></tr>`;
    const body = rows.map((r, i) => regRow(`
      <td class="${rankCls(i)}">${i+1}</td>
      <td class="sc-name">${escHtml(r.batter)}</td>
      <td class="sc-stat">${r.distance_ft} ft</td>
      <td class="sc-stat">${r.exit_velo ? r.exit_velo + ' mph' : '—'}</td>
      <td class="sc-stat">${r.launch_angle != null ? r.launch_angle + '°' : '—'}</td>
      <td class="sc-game">${escHtml(r.game)}</td>`, r, cat)).join('');
    return `<table class="sc-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
  }

  function evTable(rows, cat) {
    const head = `<tr><th></th><th>Batter</th><th class="num">Exit Velo</th><th>Result</th><th>Game</th></tr>`;
    const body = rows.map((r, i) => regRow(`
      <td class="${rankCls(i)}">${i+1}</td>
      <td class="sc-name">${escHtml(r.batter)}</td>
      <td class="sc-stat">${r.exit_velo_mph} mph</td>
      <td class="sc-result">${escHtml(r.result)}</td>
      <td class="sc-game">${escHtml(r.game)}</td>`, r, cat)).join('');
    return `<table class="sc-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
  }

  function pitchTable(rows, cat, statKey, statFmt) {
    const head = `<tr><th></th><th>Pitcher</th><th class="num">Value</th><th>Pitch</th><th>Game</th></tr>`;
    const body = rows.map((r, i) => regRow(`
      <td class="${rankCls(i)}">${i+1}</td>
      <td class="sc-name">${escHtml(r.pitcher)}</td>
      <td class="sc-stat">${statFmt(r[statKey])}</td>
      <td>${r.pitch_name ? `<span class="sc-pitch-type">${escHtml(r.pitch_name)}</span>` : ''}</td>
      <td class="sc-game">${escHtml(r.game)}</td>`, r, cat)).join('');
    return `<table class="sc-table"><thead>${head}</thead><tbody>${body}</tbody></table>`;
  }

  // ── Preview text for collapsed header ───────────────────────────────────
  function hrPreview(r)    { return r ? `<strong>${escHtml(r.batter)}</strong> — ${r.distance_ft} ft · ${escHtml(r.game)}` : ''; }
  function evPreview(r)    { return r ? `<strong>${escHtml(r.batter)}</strong> — ${r.exit_velo_mph} mph (${escHtml(r.result)}) · ${escHtml(r.game)}` : ''; }
  function pitchPreview(r, statFmt, statKey) {
    if (!r) return '';
    const pt = r.pitch_name ? ` · ${r.pitch_name}` : '';
    return `<strong>${escHtml(r.pitcher)}</strong> — ${statFmt(r[statKey])}${pt} · ${escHtml(r.game)}`;
  }

  const sections = [
    {
      emoji: '🚀', title: 'Farthest Home Runs',
      preview: hrPreview(t.farthest_hr[0]),
      table: hrTable(t.farthest_hr, 'farthest_hr'),
    },
    {
      emoji: '💨', title: 'Hardest Exit Velocity',
      preview: evPreview(t.hardest_hit[0]),
      table: evTable(t.hardest_hit, 'hardest_hit'),
    },
    {
      emoji: '⚡', title: 'Fastest Pitches',
      preview: pitchPreview(t.fastest_pitch[0], v => v + ' mph', 'speed_mph'),
      table: pitchTable(t.fastest_pitch, 'fastest_pitch', 'speed_mph', v => v + ' mph'),
    },
    {
      emoji: '🌀', title: 'Highest Spin Rate',
      preview: pitchPreview(t.most_spin[0], v => v.toLocaleString() + ' rpm', 'spin_rpm'),
      table: pitchTable(t.most_spin, 'most_spin', 'spin_rpm', v => v.toLocaleString() + ' rpm'),
    },
    {
      emoji: '🏹', title: 'Most Pitch Movement',
      preview: pitchPreview(t.most_break[0], v => v + '"', 'break_in'),
      table: pitchTable(t.most_break, 'most_break', 'break_in', v => v + '"'),
    },
  ];

  const sectionsHtml = sections.map(s => `
    <div class="sc-section">
      <div class="sc-section-header" onclick="toggleScSection(this)">
        <span class="sc-section-title"><span class="sc-emoji">${s.emoji}</span>${s.title}</span>
        <span class="sc-preview">${s.preview}</span>
        <span class="sc-chevron">▾</span>
      </div>
      <div class="sc-body">${s.table}</div>
    </div>`).join('');

  document.getElementById('statcast-content').innerHTML = `
    <div class="statcast-credit">
      MLB games only · data via
      <a href="https://baseballsavant.mlb.com" target="_blank">Baseball Savant</a>
      · best single event per player/pitcher
    </div>
    <div class="statcast-sections">${sectionsHtml}</div>`;
}

Promise.all([
  fetch('players.json').then(r => r.json()),
  fetch('games.json').then(r => r.json()),
  fetch('statcast_superlatives.json').then(r => r.json()).catch(() => null),
]).then(([players, games, statcast]) => {
  allPlayers   = players;
  allGames     = games;
  statcastData = statcast;
  assignRanks(allPlayers);
  document.getElementById('header-sub').textContent =
    `${players.length} players · ${games.length} games`;
  renderBat();
  renderSta();
  renderRel();
  renderGames();
  renderHome();
  renderParks();
  renderStatcast();
}).catch(err => {
  document.getElementById('header-sub').textContent = 'Error loading data';
  console.error(err);
});
</script>
</body>
</html>
